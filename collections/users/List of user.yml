info:
  name: List of user
  type: http
  seq: 1

http:
  method: GET
  url: "{{domain}}:{{port}}/api/{{version}}/users?page=1&limit=2"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "2"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
