info:
  name: SSO Authorize URL
  type: http
  seq: 5

http:
  method: GET
  url: "{{domain}}:{{port}}/api/{{version}}/auth/:provider/authorize-url"
  params:
    - name: provider
      value: zoho
      type: path
    - name: code_challenge
      value: "dummy_code_challenge"
      type: query
    - name: state
      value: "dummy_state"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
