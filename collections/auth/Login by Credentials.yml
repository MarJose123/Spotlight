info:
  name: Login by Credentials
  type: http
  seq: 1

http:
  method: POST
  url: "{{domain}}:{{port}}/api/{{version}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "Clifford.Waters@gmail.com",
        "password": "admin123"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if(res.status === 200 && res.body.access_token) {
          bru.setEnvVar("access_token", res.body.access_token);
        }
        if(res.status === 200 && res.body.refresh_token){
          bru.setEnvVar("refresh_token", res.body.refresh_token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
