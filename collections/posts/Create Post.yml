info:
  name: Create Post
  type: http
  seq: 5

http:
  method: POST
  url: "{{domain}}:{{port}}/api/{{version}}/posts"
  body:
    type: json
    data: |-
      {
        "content": "Hello, this is a new post!",
        "attachmentType": "text"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
