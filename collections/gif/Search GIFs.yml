info:
  name: Search GIFs
  type: http
  seq: 1

http:
  method: GET
  url: "{{domain}}:{{port}}/api/{{version}}/gifs?query=funny&limit=10"
  params:
    - name: query
      value: funny
      type: query
    - name: limit
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
