opencollection: 1.0.0

info:
  name: collections
  version: v1.0.0
config:
  proxy:
    inherit: false
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""
    disabled: true

request:
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
    presets:
      request:
        type: http
        url: "{{domain}}:{{port}}/api/{{version}}/"
      defaultEnvironment: Development
