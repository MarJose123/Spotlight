name: ""
services:
  spotlight-api:
    container_name: spotlight-api
    image: spotlight-api:latest
    pull_policy: never
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: 1
        reservations:
          memory: 256M
    working_dir: /usr/src/spotlight
    command: ["bun", "run", "--cwd", "api", "start:dev"]
    volumes:
      - ./api:/usr/src/spotlight/api
      - api-node-modules:/usr/src/spotlight/api/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: ./api/.env
        required: true
    environment:
      # Workspace whose node_modules the entry point keeps in sync with bun.lock.
      SPOTLIGHT_WORKSPACE: api
      DB_CONNECTION: postgres
      DB_HOST: spotlight-db
      DB_PORT: 5432
      DB_DATABASE: spotlight
      DB_USERNAME: spotlight
      DB_PASSWORD: spotlight
      # S3 Bucket or compatible
      BUCKET_ENDPOINT: http://spotlight-bucket:9000
      BUCKET_NAME: spotlight
      BUCKET_REGION: us-east-1
      BUCKET_ACCESS_KEY_ID: dev
      BUCKET_SECRET_ACCESS_KEY: dev-password
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/api/v1/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 12s
    depends_on:
      spotlight-db:
        condition: service_healthy
      spotlight-bucket:
        condition: service_healthy
    networks:
      - spotlight

  spotlight-web:
    container_name: spotlight-web
    image: spotlight-web:latest
    pull_policy: never
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: 1
        reservations:
          memory: 256M
    working_dir: /usr/src/spotlight
    command: ["bun", "run", "--cwd", "web", "dev"]
    environment:
      # Workspace whose node_modules the entry point keeps in sync with bun.lock.
      SPOTLIGHT_WORKSPACE: web
    volumes:
      - ./web:/usr/src/spotlight/web
      - web-node-modules:/usr/src/spotlight/web/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WEB_PORT:-5173}:5173"
    healthcheck:
      test: [ "CMD", "bun", "-e", "fetch('http://localhost:5173').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 5s
    depends_on:
      spotlight-api:
        condition: service_healthy
    networks:
      - spotlight

  spotlight-bucket:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: spotlight-bucket
    restart: unless-stopped
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: 1
        reservations:
          memory: 256M
    environment:
      MINIO_ROOT_USER: dev
      MINIO_ROOT_PASSWORD: dev-password
    ports:
      - "9000:9000" # S3 API Port
      - "9001:9001" # Console Port
    healthcheck:
      test:  ["CMD", "silo", "healthcheck", "ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - spotlight
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - spotlight-bucket-data:/data


  spotlight-db:
    container_name: spotlight-db
    image: postgres:17-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: 1
        reservations:
          memory: 256M
    environment:
      POSTGRES_USER: spotlight
      POSTGRES_PASSWORD: spotlight
      POSTGRES_DB: spotlight
    ports:
      - "5432:5432"
    healthcheck:
      # Check for the actual database, not just a server accepting connections.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - spotlight-db-data:/var/lib/postgresql/data
    networks:
      - spotlight


networks:
  spotlight:
    name: spotlight

volumes:
  spotlight-db-data:
    driver: local
  spotlight-bucket-data:
    driver: local
  api-node-modules:
    driver: local
  web-node-modules:
    driver: local
